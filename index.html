<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pulsar Labs</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12}#site{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="site" title="Pulsar Labs" src="./pulsar-labs-editada.html"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
 try{
  const d=frame.contentDocument;
  if(!d)return;
  const style=d.createElement('style');style.textContent='.dlg-body .detail .shot{display:none!important}';d.head.appendChild(style);
  function clean(){
   d.querySelectorAll('button[data-cart-add="ej-pulso-citrico"]').forEach(b=>{const card=b.closest('article');if(card)card.remove();});
  }
  clean();
  let active=null;
  d.addEventListener('click',e=>{
   const btn=e.target.closest('button[data-cart-add]');
   if(!btn)return;
   const id=btn.getAttribute('data-cart-add');
   if(id==='ej-pulso-citrico'){e.preventDefault();e.stopPropagation();return;}
   const card=btn.closest('article');
   if(!card)return;
   active={id,name:card.querySelector('.name')?.textContent.trim(),price:card.querySelector('.price')?.textContent.trim()};
   [0,50,150,350].forEach(ms=>setTimeout(()=>{
    if(!active||active.id!==id)return;
    const dlg=d.querySelector('#dlgDetail');
    if(!dlg)return;
    const h=dlg.querySelector('.dlg-head h2');
    const price=dlg.querySelector('.big-price');
    if(h&&active.name)h.textContent=active.name;
    if(price&&active.price)price.textContent=active.price;
   },ms));
  },true);
  const observer=new MutationObserver(clean);observer.observe(d.body,{childList:true,subtree:true});
 }catch(e){}
});
</script></body></html>
