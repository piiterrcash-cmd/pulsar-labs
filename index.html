<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulsar Labs</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12}#site{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="site" title="Pulsar Labs" src="./pulsar-labs-editada.html"></iframe><script>
document.getElementById('site').addEventListener('load',function(){try{
 const d=this.contentDocument;if(!d)return;
 const s=d.createElement('style');s.id='disable-product-click';s.textContent='.card{pointer-events:none!important;cursor:default!important}.card button,.card [data-cart-add],.card a{pointer-events:auto!important;cursor:pointer!important}';d.head.appendChild(s);
 d.addEventListener('click',function(e){
   const card=e.target.closest('.card');
   if(card && !e.target.closest('button,[data-cart-add],a')){e.preventDefault();e.stopPropagation();}
 },true);
}catch(e){console.error(e)}});
</script></body></html>
