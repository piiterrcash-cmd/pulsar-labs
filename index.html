<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsar Labs</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12}
#site{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" title="Pulsar Labs" src="./pulsar-labs-editada.html"></iframe>
<script>
const frame=document.getElementById('site');
function applyChanges(){
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    if(!doc.getElementById('pulsar-fix-style')){
      const style=doc.createElement('style');
      style.id='pulsar-fix-style';
      style.textContent='.dlg-body .detail .shot{display:none!important}';
      doc.head.appendChild(style);
    }
    doc.querySelectorAll('[data-id="ej-pulso-citrico"]').forEach(el=>el.remove());
    const observer=new MutationObserver(()=>{
      doc.querySelectorAll('[data-id="ej-pulso-citrico"]').forEach(el=>el.remove());
    });
    observer.observe(doc.body,{childList:true,subtree:true});
  }catch(e){}
}
frame.addEventListener('load',applyChanges);
</script>
</body>
</html>
